<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Contact</title>
</head>
<body>
<a href="index.html" class="home-icon" aria-label="Home">Jay Rosales.</a>

<div class="nav">        
    <nav class="navbar">
        <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>            
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</div>
<div class="contact-layout">
    <div class="contact-left">
        <form class="my-form">
            <div class="side-by-side">
            <div class="form-row-sm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required></input>
            </div>
    
            <div class="form-row-sm">
                <label for="email">Email</label>
                    <input id="email" name="email" type="email" required></input>
            </div>
            </div>
            <div class="form-row-lg">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button class="button-type">Send Message</button>
        </form>
        <div class="contact-links">
            <nav class="nav-links" aria-label="Other ways to contact me">
                <ul>
                    <li><a href="mailto:JayTrosales@hotmail.com" target="_blank"><img src="images/mail.svg">Email</a></li>
                    <li><a href="https://github.com/JayRosa27" target="_blank"><img src="images/github.svg">GitHub</a></li>
                    <li><a href="https://www.linkedin.com/in/jtrosales/" target="_blank"><img src="images/linkedin.svg">LinkedIn</a></li>
                </ul>
            </nav>
        </div>
    </div>
    <div class="contact-right">
        <div class="contact-header">
            <h1>Let's <span>Talk.</span></h1>
            <p class="contact-text">I’m open to software engineering opportunities where I can keep learning, build useful things, and work with a great team. If you’d like to connect or talk about a project, send me a message!</p>

        </div>
    </div>
</div>
</body>
</html>
